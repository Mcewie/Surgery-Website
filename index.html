<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Riverbank Surgery — Sign In</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">RS</div>
      <h1>Riverbank Surgery</h1>
      <p class="brand-sub">Private project workspace</p>
    </div>

    <form id="login-form" class="auth-form" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter access password" />

      <button type="submit">Sign in</button>
      <p id="auth-error" class="auth-error" hidden></p>
    </form>

    <p class="auth-foot">
      Authorised access only. Activity may be logged.
    </p>
  </main>

  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.hidden = true;

      const ok = await Auth.signIn(email, password);
      if (ok) {
        window.location.href = 'home.html';
      } else {
        errorEl.textContent = 'Invalid email or password.';
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
